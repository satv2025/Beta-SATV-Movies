<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sol Argentino TV Movies</title>
  <link rel="stylesheet" href="assets/css/your-navigator-home.css">
  <link rel="icon" href="https://movies.solargentinotv.com.ar/assets/media/images/SolArgentinoTVMOVIES.ico">
</head>

<body>

  <header>
    <div class="wrap">
      <div class="logo">Sol Argentino TV Movies</div>
      <nav class="nav">
        <a href="#">Inicio</a>
        <a href="#">Películas</a>
        <a href="#">Series</a>
      </nav>
      <div class="search">
        <input id="searchInput" placeholder="Buscar…">
      </div>
    </div>
  </header>

  <main>

    <section class="hero">
      <div class="hero-info">
        <h1>Matias Ponce – La Película</h1>
        <p>Película · 2022 · 1 h</p>
        <div class="hero-actions">
          <button class="btn primary" onclick="go('matiponcepeli')">▶ Ver</button>
          <button class="btn secondary" disabled>Esta es nuestra recomendación</button>
        </div>
      </div>
    </section>

    <div class="filters">
      <button data-filter="all" class="active">Todo</button>
      <button data-filter="Película">Películas</button>
      <button data-filter="Serie">Series</button>
    </div>

    <div class="grid">

      <!-- CARD -->
      <div class="card" data-type="Película" onclick="go('matiponcepeli')">
        <div class="media">
          <img src="https://movies.solargentinotv.com.ar/assets/media/images/mpthumb.jpg">

          <video muted loop playsinline preload="none"
            data-src="https://gitlab.com/solargentinotv/satvmoviesvideos/-/raw/main/MATIAS_PONCE_-_LA_PEL%C3%8DCULA__TR%C3%81ILER_OFICIAL_2022.webm">
          </video>
        </div>

        <div class="meta">
          <h3>Matias Ponce – La Película</h3>
          <span>Película · 2022 · 1 h</span>
        </div>
      </div>

      <!-- PODÉS DUPLICAR LAS CARDS -->
      <!-- SOLO CAMBIÁS IMG + data-src -->

    </div>

  </main>

  <script src="assets/js/app.js"></script>
</body>

</html>
