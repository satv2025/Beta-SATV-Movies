<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sol Argentino TV | Transmisión en Vivo</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/individual.css">
    <link rel="stylesheet" href="../assets/css/vidstack/1.css">
    <link rel="stylesheet" href="../assets/css/vidstack/2.css">

    <!-- Vidstack -->
    <script src="https://cdn.vidstack.io/player" type="module"></script>

    <link rel="icon" href="https://old.movies.solargentinotv.com.ar/assets/media/images/SolArgentinoTVMOVIES.ico"
        type="image/x-icon">

    <style>
        media-player {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
        }

        media-control-bar {
            background: linear-gradient(to top, rgba(0, 0, 0, .85), transparent);
        }

        media-time-range {
            --media-range-track-height: 5px;
            --media-range-thumb-height: 12px;
            --media-range-thumb-width: 12px;
            --media-range-track-color: rgba(255, 255, 255, .2);
            --media-range-track-filled-color: #e50914;
        }

        .vds-controls-group .vds-slider-thumb {
            opacity: 0;
        }

        /* ======================
   SIGNAL DROPDOWN
====================== */

        .signal-menu button span {
            opacity: 1;
            font-size: 0.8em;
            position: relative;
            top: -0.09em;
            font-weight: 300;
        }

        .signal-dropdown {
            position: relative;
            margin-bottom: -13px;
            zoom: 0.9;
            margin-left: 4em;
            margin-top: -3.2em;
        }

        .signal-toggle {
            background: #242424;
            color: #fff;
            padding: 10px 14px;
            border: none;
            cursor: pointer;
            border-radius: 0.10em;
            position: relative;
            font-size: 19px;
            width: 11.56em;
            text-align: left;
            border: 0.04em solid rgb(77, 77, 77);
            font-weight: 500;
        }

        /* flecha */
        .signal-toggle::after {
            content: "\25BC";
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%) rotate(0deg);
            transition: transform .25s ease;
            font-size: 24px;
            opacity: .8;
        }

        /* flecha rotada */
        .signal-dropdown.open .signal-toggle::after {
            transform: translateY(-50%) rotate(180deg);
        }

        /* menú */
        .signal-menu {
            display: none;
            position: absolute;
            background: #242424;
            margin-top: 4px;
            z-index: 3;
            border: 0.04em solid rgb(77, 77, 77);
            padding-top: 1em;
            padding-bottom: 1em;
            width: 16em;
            margin-left: -2.26em;
        }

        /* visible */
        .signal-dropdown.open .signal-menu {
            display: block;
        }

        /* opciones */
        .signal-menu-option {
            display: block;
            width: 100%;
            padding: 10px 14px;
            background: none;
            color: #fff;
            border: none;
            text-align: left;
            cursor: pointer;
            font-size: 19px;
            font-weight: 500;
        }

        .signal-menu-option:hover {
            background-color: rgb(66, 66, 66);
        }
    </style>
</head>

<body>

    <header>
        <div class="wrap">
            <a href="../" class="back">← Volver</a>
            <div class="logo">Sol Argentino TV</div>
        </div>
    </header>

    <main>

        <section class="hero">

            <!-- PLAYER -->
            <div class="media">
                <media-player title="Sol Argentino TV – En Vivo"
                    src="https://rtmp.solargentinotv.com.ar/live/canal1.m3u8" stream-type="live" autoplay playsinline>

                    <media-provider></media-provider>

                    <!-- Layout especial para LIVE -->
                    <media-video-layout live></media-video-layout>

                </media-player>
            </div>

            <!-- INFO -->
            <article class="card">

                <h1>Sol Argentino TV – En Vivo</h1>

                <div class="kv">
                    <span class="badge live">LIVE</span>
                    <span class="badge">24 hs</span>
                    <span class="badge age">ATP</span>
                </div>

                <p>
                    Disfrutá la transmisión en vivo de Sol Argentino TV.
                    Noticias, entretenimiento y programación continua, estés donde estés.
                </p>

                <div class="meta">
                    <p class="signal-row">
                        <strong>Señal:</strong>

                    <div class="signal-dropdown">
                        <button class="signal-toggle" id="signalMenuBtn">
                            Señal 1
                        </button>

                        <div class="signal-menu">
                            <button class="signal-menu-option"
                                data-src="https://rtmp.solargentinotv.com.ar/live/canal1.m3u8">
                                Señal 1 <span>(principal)</span>
                            </button>

                            <button class="signal-menu-option" data-src="http://192.168.1.36/live/canal1.m3u8">
                                Señal 2 <span>(secundaria)</span>
                            </button>

                            <button class="signal-menu-option" data-src="http://186.129.99.27/live/canal1.m3u8">
                                Señal 3 <span>(respaldo)</span>
                            </button>
                        </div>
                    </div>
                    </p>
                    <p><strong>Formato:</strong> <span>Streaming en vivo (HLS)</span></p>
                    <p><strong>Calidad:</strong> <span>1080p - 60 FPS</span></p>
                </div>

            </article>

        </section>

    </main>
    <script>
        const signalDropdown = document.querySelector('.signal-dropdown');
        const signalBtn = document.getElementById('signalMenuBtn');
        const signalOptions = document.querySelectorAll('.signal-menu-option');
        const player = document.querySelector('media-player');

        signalBtn.addEventListener('click', () => {
            signalDropdown.classList.toggle('open');
        });

        signalOptions.forEach(option => {
            option.addEventListener('click', () => {
                const src = option.dataset.src;

                // Solo "Señal X" (sin el span)
                const label = option.childNodes[0].textContent.trim();

                player.src = src;
                signalBtn.textContent = label;

                signalDropdown.classList.remove('open');
            });
        });

        document.addEventListener('click', e => {
            if (!signalDropdown.contains(e.target)) {
                signalDropdown.classList.remove('open');
            }
        });
    </script>
</body>

</html>
