<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sol Argentino TV | Transmisión en Vivo</title>
    <link rel="stylesheet" href="../assets/css/individual.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
    <link rel="stylesheet" href="https://old.movies.solargentinotv.com.ar/assets/css/plyr/satvplyr.css" />
    <link rel="icon" href="https://old.movies.solargentinotv.com.ar/assets/media/images/SolArgentinoTVMOVIES.ico"
        type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>

<body>

    <header>
        <div class="wrap">
            <a href="../" class="back">← Volver</a>
            <div class="logo">Sol Argentino TV</div>
        </div>
    </header>

    <main>

        <!-- HERO -->
        <section class="hero">

            <div class="media">
                <video id="player" playsinline controls poster="https://i.ytimg.com/vi/7Y7fi2FA1wA/hqdefault.jpg">
                </video>
            </div>

            <!-- INFO PANEL -->
            <article class="card">

                <h1>Sol Argentino TV – En Vivo</h1>

                <div class="kv">
                    <span class="badge">LIVE</span>
                    <span class="badge">24 hs</span>
                    <span class="badge age">ATP</span>
                </div>

                <p>
                    Disfrutá la transmisión en vivo de Sol Argentino TV.
                    Noticias, entretenimiento y programación continua, estés donde estés.
                </p>

                <div class="meta">
                    <p><strong>Señal:</strong> <span>Sol Argentino TV</span></p>
                    <p><strong>Formato:</strong> <span>Streaming en vivo (HLS)</span></p>
                    <p><strong>Calidad:</strong> <span>1080p - 60 FPS | Próximamente: 4K</span></p>
                </div>

            </article>

        </section>

    </main>

    <!-- Plyr JS -->
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.min.js"></script>

    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

    <!-- INIT PLAYER -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const video = document.getElementById('player');
            const source = 'https://rtmp.solargentinotv.com.ar/live/canal1.m3u8'; // Verifica que esta URL esté activa

            if (Hls.isSupported()) {
                const hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                });

                hls.loadSource(source);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => { });
                });

            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = source;
                video.play().catch(() => { });
            }

            const player = new Plyr(video, {
                controls: [
                    'play-large',
                    'play',
                    'progress',
                    'current-time',
                    'mute',
                    'volume',
                    'settings',
                    'fullscreen'
                ],
                settings: ['speed'],
                speed: {
                    selected: 1,
                    options: [0.25, 0.5, 0.75, 1, 1.25, 1.3, 1.35, 1.4, 1.5, 2, 8]
                },
                ratio: '16:9'
            });
        });
    </script>

</body>

</html>
