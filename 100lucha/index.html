<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100% Lucha – La Película | Sol Argentino TV Movies</title>

  <!-- CSS base -->
  <link rel="stylesheet" href="../assets/css/individual.css">
  <link rel="stylesheet" href="../assets/css/plyrthumbs.css">

  <!-- Plyr CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
  <link rel="stylesheet" href="https://old.movies.solargentinotv.com.ar/assets/css/plyr/satvplyr.css">

  <link rel="icon" href="https://old.movies.solargentinotv.com.ar/assets/media/images/SolArgentinoTVMOVIES.ico"
    type="image/x-icon">

  <!-- Plyr JS -->
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.min.js"></script>

  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>

<body>

  <header>
    <div class="wrap">
      <a href="../" class="back">← Volver</a>
      <div class="logo">Sol Argentino TV Movies</div>
    </div>
  </header>

  <main>
    <section class="hero">

      <!-- PLAYER -->
      <div class="media">
        <video id="player" playsinline controls crossorigin="anonymous"
          poster="https://old.movies.solargentinotv.com.ar/assets/media/images/100luchathumb.jpg">
        </video>
      </div>

      <!-- INFO -->
      <article class="card">

        <h1>100% Lucha – La Película</h1>

        <div class="kv">
          <span class="badge">Película</span>
          <span class="badge">2008</span>
          <span class="badge">1 h 20 min</span>
          <span class="badge age">12+</span>
        </div>

        <p>
          Koshe Plostenko, un mafioso implacable, secuestra a los luchadores de 100%
          Lucha para obligarlos a pelear en su club clandestino.
        </p>

      </article>

    </section>
  </main>

  <!-- PLAYER INIT -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const video = document.getElementById('player');
      const source =
        'https://cdn.jsdelivr.net/gh/satv2025/media@main/videos/cpcl/koshep/100-Lucha-La-Pel%C3%ADcula.m3u8';

      // Verificamos si HLS es compatible con el navegador
      if (Hls.isSupported()) {
        const hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
        });
        hls.loadSource(source);
        hls.attachMedia(video);
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = source;
      }

      // Iniciamos Plyr con las miniaturas y otras configuraciones
      new Plyr(video, {
        controls: [
          'play-large',
          'play',
          'progress',
          'current-time',
          'mute',
          'volume',
          'settings',
          'fullscreen'
        ],
        settings: ['speed'],
        speed: {
          selected: 1,
          options: [0.5, 0.75, 1, 1.25, 1.5, 2]
        },
        ratio: '16:9',
        invertTime: false,

        // Configuración de miniaturas de avance
        previewThumbnails: {
          enabled: true,
          src: 'https://movies.solargentinotv.com.ar/assets/media/cpl-thumbnails/thumbs.vtt' // Asegúrate de que la URL del archivo VTT sea correcta
        }
      });
    });
  </script>

</body>

</html>
